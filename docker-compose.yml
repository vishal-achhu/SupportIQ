services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supportiq}
      POSTGRES_USER: ${POSTGRES_USER:-supportiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
    ports: ["5432:5432"]
    volumes: [supportiq_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-service:
    build: ./ai-service
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-supportiq}:${POSTGRES_PASSWORD:-change_me_local}@postgres:5432/${POSTGRES_DB:-supportiq}
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: ./gateway
    environment:
      PYTHON_API_URL: http://ai-service:8000
      PORT: 3000
    ports: ["3000:3000"]
    depends_on: [ai-service]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL:-http://localhost:3000/api}
    ports: ["5173:80"]
    depends_on: [gateway]

volumes:
  supportiq_pg:
